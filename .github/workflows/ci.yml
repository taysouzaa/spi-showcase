name: CI

# Roda a verificacao do Backend e do Frontend a cada push e pull request na main.
#
# As variaveis de ambiente dos testes vivem em Backend/vitest.config.ts com
# valores fake: nenhum teste faz chamada real a AWS nem ao banco (Prisma e
# mockado). Por isso o job nao precisa de secret nenhum.
#
# O build do Frontend roda sem VITE_API_URL de proposito: aqui interessa saber
# se compila. A variavel real vive no AWS Amplify.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao
        run: npm run build
